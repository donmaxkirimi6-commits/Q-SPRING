<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Logistics Tracker</title>
<style>
  :root { --bg:#EEF4F7; --card:#fff; --ink:#0F2233; --muted:#52677A; --line:#D2DEE6; --accent:#0A6C8F; --accent-ink:#fff; --good:#14804A; --bad:#B3261E; --soft:#DDEEF5; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0B1620; --card:#122331; --ink:#E7F0F6; --muted:#9BB0C0; --line:#223648; --accent:#4DB8DE; --accent-ink:#06202B; --good:#52C98A; --bad:#FF8A80; --soft:#173244; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width:62rem; margin:0 auto; padding:0 1rem; }
  header { background:#083349; color:#fff; }
  .brand { display:flex; gap:.6rem; align-items:center; font-weight:800; font-size:1.3rem; padding:1rem 0 .6rem; }
  nav { display:flex; gap:.35rem; overflow-x:auto; padding-bottom:.8rem; }
  nav button { flex:none; font:inherit; font-weight:600; color:#CDE6F1; background:none; border:1px solid transparent; border-radius:999px; padding:.35rem .95rem; cursor:pointer; }
  nav button:hover { border-color:#4DB8DE; }
  nav button.on { background:#fff; color:#083349; }
  main { padding:1.5rem 1rem 2rem; }
  h2 { margin:0 0 1rem; font-size:1.5rem; letter-spacing:-.01em; }
  .cards { display:grid; gap:.9rem; grid-template-columns:repeat(auto-fit, minmax(12rem, 1fr)); margin-bottom:1.25rem; }
  .card { background:var(--card); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:6px; padding:.9rem 1rem; display:grid; gap:.15rem; }
  .card small { color:var(--muted); font-weight:600; }
  .card strong { font-size:1.6rem; line-height:1.2; }
  .card em { font-style:normal; color:var(--muted); font-size:.85rem; }
  .good { color:var(--good); } .bad { color:var(--bad); }
  .form { display:grid; gap:.75rem; grid-template-columns:repeat(auto-fit, minmax(10rem, 1fr)); align-items:end; background:var(--card); border:1px solid var(--line); padding:1rem; border-radius:6px; margin-bottom:1.25rem; }
  label { display:grid; gap:.25rem; font-weight:600; font-size:.9rem; }
  input { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:.5rem .6rem; width:100%; }
  .btn { font:inherit; font-weight:700; background:var(--accent); color:var(--accent-ink); border:0; border-radius:6px; padding:.6rem 1.1rem; cursor:pointer; }
  .btn.ghost { background:none; color:var(--ink); border:1px solid var(--line); }
  .btn:hover { filter:brightness(1.1); }
  .link { font:inherit; background:none; border:0; color:var(--accent); text-decoration:underline; cursor:pointer; padding:0; }
  .scroll { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:6px; }
  table { border-collapse:collapse; width:100%; min-width:34rem; }
  th, td { padding:.55rem .8rem; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child, .l { text-align:left; }
  th { font-size:.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .tot td { font-weight:800; background:var(--soft); }
  .row { display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:1rem; align-items:center; }
  .seg { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { font:inherit; font-weight:600; background:var(--card); color:var(--ink); border:0; padding:.5rem 1rem; cursor:pointer; }
  .seg .on { background:var(--accent); color:var(--accent-ink); }
  .note { color:var(--muted); font-size:.9rem; }
  footer { color:var(--muted); font-size:.85rem; padding-bottom:2rem; }
  :focus-visible { outline:3px solid #F4B942; outline-offset:2px; }
  @media print { header, .row, footer { display:none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#7FD3F0" aria-hidden="true"><path d="M12 2C12 2 5 10.2 5 15a7 7 0 0014 0C19 10.2 12 2 12 2z"/></svg>
      <span>Water Logistics Tracker</span>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer class="wrap">
  Records are saved in this browser on this device. Use Export CSV on the Reports page to keep a copy.
  <button class="link" data-act="clear">Clear all data</button>
</footer>

<script>
  var KEY = "waterLogistics.v1";

  // Each tab: its label and the fields of its form [name, label, input type]
  var T = {
    production:  { label: "Production",  fields: [["date","Date","date"],["litres","Litres produced","number"],["note","Source or note","text"]] },
    delivery:    { label: "Delivery",    fields: [["date","Date","date"],["customer","Customer","text"],["litres","Litres delivered","number"],["note","Vehicle or note","text"]] },
    electricity: { label: "Electricity", fields: [["date","Date","date"],["units","Units (kWh)","number"],["cost","Cost (KSh)","number"],["note","Note","text"]] },
    income:      { label: "Income",      fields: [["date","Date","date"],["source","Received from","text"],["amount","Amount (KSh)","number"]] },
    expenditure: { label: "Expenditure", fields: [["date","Date","date"],["category","Category","text"],["amount","Amount (KSh)","number"],["note","Note","text"]] }
  };
  var HEAD = ["Period","Produced (L)","Delivered (L)","Not delivered (L)","Electricity (kWh)","Electricity cost (KSh)","Income (KSh)","Expenditure (KSh)","Profit (KSh)"];

  var view = "dashboard", mode = "weekly", data = load(), lastDate = today();

  function blank() { return { production:[], delivery:[], electricity:[], income:[], expenditure:[] }; }
  function load() {
    var d = {};
    try { d = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
    var b = blank();
    for (var k in b) if (Array.isArray(d[k])) b[k] = d[k];
    return b;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

  var $ = function (s) { return document.querySelector(s); };
  var uid = function () { return Date.now() + "" + Math.floor(Math.random() * 1e6); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
  function fmt(n) { return (+n || 0).toLocaleString(undefined, { maximumFractionDigits: 1 }); }
  function iso(d) { return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  function today() { return iso(new Date()); }
  function monthName(k) { return new Date(k + "-01T00:00:00").toLocaleString(undefined, { month: "long", year: "numeric" }); }
  function weekStart(s) { var d = new Date(s + "T00:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); }

  // Adds up every record into groups (by week, month, or all) using keyFn(date)
  function summarise(keyFn, filter) {
    var m = {};
    function add(date, f, v) {
      if (!date || (filter && !filter(date))) return;
      var k = keyFn(date);
      if (!m[k]) m[k] = { prod:0, deliv:0, kwh:0, elec:0, inc:0, exp:0 };
      m[k][f] += +v || 0;
    }
    data.production.forEach(function (r) { add(r.date, "prod", r.litres); });
    data.delivery.forEach(function (r) { add(r.date, "deliv", r.litres); });
    data.electricity.forEach(function (r) { add(r.date, "kwh", r.units); add(r.date, "elec", r.cost); });
    data.income.forEach(function (r) { add(r.date, "inc", r.amount); });
    data.expenditure.forEach(function (r) { add(r.date, "exp", r.amount); });
    return m;
  }

  function dash() {
    var mk = today().slice(0, 7);
    var s = summarise(function () { return "x"; }, function (d) { return d.indexOf(mk) === 0; }).x || { prod:0, deliv:0, kwh:0, elec:0, inc:0, exp:0 };
    var profit = s.inc - s.exp - s.elec;
    var empty = !Object.keys(data).some(function (k) { return data[k].length; });
    var C = [
      ["Water produced", fmt(s.prod) + " L"],
      ["Water delivered", fmt(s.deliv) + " L"],
      ["Not delivered", fmt(s.prod - s.deliv) + " L", "Produced minus delivered"],
      ["Electricity", fmt(s.kwh) + " kWh", "KSh " + fmt(s.elec)],
      ["Power per 1,000 L", (s.prod ? fmt(s.kwh / s.prod * 1000) : "0") + " kWh", "Electricity used per 1,000 L produced"],
      ["Income", "KSh " + fmt(s.inc)],
      ["Expenditure", "KSh " + fmt(s.exp), "Electricity not included"],
      ["Profit", "KSh " + fmt(profit), "Income − expenditure − electricity", profit < 0 ? "bad" : "good"]
    ];
    return "<h2>This month: " + monthName(mk) + "</h2>" +
      (empty ? '<p class="note">No records yet. Add records from the tabs above, or <button class="link" data-act="sample">load sample data</button> to see how it works.</p>' : "") +
      '<div class="cards">' + C.map(function (c) {
        return '<div class="card"><small>' + c[0] + '</small><strong class="' + (c[3] || "") + '">' + c[1] + '</strong>' + (c[2] ? "<em>" + c[2] + "</em>" : "") + "</div>";
      }).join("") + "</div>" +
      '<button class="btn" data-view="reports">View weekly and monthly reports</button>';
  }

  function listView(k) {
    var t = T[k], rows = data[k].slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var form = '<form class="form" data-form="' + k + '">' + t.fields.map(function (f) {
      var n = f[0], ty = f[2], a = "";
      if (ty === "number") a = ' min="0" step="any" required';
      if (ty === "date") a = ' value="' + lastDate + '" required';
      if (ty === "text" && n !== "note") a = " required";
      if (n === "category") a += ' list="cats"';
      return "<label>" + f[1] + '<input name="' + n + '" type="' + ty + '"' + a + "></label>";
    }).join("") + '<button class="btn" type="submit">Add record</button></form>' +
      (k === "expenditure" ? '<datalist id="cats"><option>Fuel</option><option>Wages</option><option>Repairs</option><option>Chemicals</option><option>Licences</option><option>Other</option></datalist>' : "");
    var table = rows.length ? '<div class="scroll"><table><thead><tr>' + t.fields.map(function (f) {
      return '<th class="' + (f[2] === "number" ? "" : "l") + '">' + f[1] + "</th>";
    }).join("") + "<th></th></tr></thead><tbody>" + rows.map(function (r) {
      return "<tr>" + t.fields.map(function (f) {
        return f[2] === "number" ? "<td>" + fmt(r[f[0]]) + "</td>" : '<td class="l">' + esc(r[f[0]]) + "</td>";
      }).join("") + '<td><button class="link bad" data-del="' + k + ":" + r.id + '">Delete</button></td></tr>';
    }).join("") + "</tbody></table></div>" : '<p class="note">No ' + t.label.toLowerCase() + " records yet.</p>";
    return "<h2>" + t.label + "</h2>" + form + table;
  }

  function repRows() {
    var keyFn = mode === "weekly" ? weekStart : function (d) { return d.slice(0, 7); };
    var m = summarise(keyFn), tot = { prod:0, deliv:0, kwh:0, elec:0, inc:0, exp:0 };
    function toRow(l, s) { return [l, s.prod, s.deliv, s.prod - s.deliv, s.kwh, s.elec, s.inc, s.exp, s.inc - s.exp - s.elec]; }
    var rows = Object.keys(m).sort().reverse().map(function (k) {
      for (var f in tot) tot[f] += m[k][f];
      return toRow(mode === "weekly" ? "Week of " + k : monthName(k), m[k]);
    });
    return { rows: rows, total: toRow("Total", tot) };
  }

  function rep() {
    var r = repRows();
    function tr(row, isTotal) {
      return "<tr" + (isTotal ? ' class="tot"' : "") + ">" + row.map(function (v, i) {
        return i ? "<td" + (i === 8 && v < 0 ? ' class="bad"' : "") + ">" + fmt(v) + "</td>" : "<td>" + esc(v) + "</td>";
      }).join("") + "</tr>";
    }
    return "<h2>" + (mode === "weekly" ? "Weekly" : "Monthly") + " report</h2>" +
      '<div class="row"><div class="seg"><button data-mode="weekly" class="' + (mode === "weekly" ? "on" : "") + '">Weekly</button>' +
      '<button data-mode="monthly" class="' + (mode === "monthly" ? "on" : "") + '">Monthly</button></div>' +
      '<button class="btn ghost" data-act="csv">Export CSV</button><button class="btn ghost" data-act="print">Print</button></div>' +
      (r.rows.length ? '<div class="scroll"><table><thead><tr>' + HEAD.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
        "</tr></thead><tbody>" + r.rows.map(function (x) { return tr(x); }).join("") + tr(r.total, true) + "</tbody></table></div>" +
        '<p class="note">Profit = income − expenditure − electricity cost. “Not delivered” is water produced but not recorded as delivered (losses, storage or unrecorded sales). Weeks start on Monday.</p>'
        : '<p class="note">No records to report yet.</p>');
  }

  function csv() {
    var r = repRows();
    var text = [HEAD].concat(r.rows, [r.total]).map(function (row) {
      return row.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
    a.download = "water-" + mode + "-report.csv";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function sample() {
    var names = ["Meru Hotel", "Nkubu Market", "Kiirua Dairy", "Maua School", "Town Kiosks"], cats = ["Fuel", "Wages", "Repairs", "Chemicals"];
    for (var i = 0; i < 28; i++) {
      var d = new Date(); d.setDate(d.getDate() - i); var ds = iso(d);
      var p = 4200 + (i * 379) % 1500, dl = Math.round(p * (0.82 + ((i * 7) % 10) / 100)), u = 65 + (i * 11) % 25;
      data.production.push({ id: uid(), date: ds, litres: p, note: "Borehole 1" });
      data.delivery.push({ id: uid(), date: ds, customer: names[i % 5], litres: dl, note: "Truck 1" });
      data.electricity.push({ id: uid(), date: ds, units: u, cost: Math.round(u * 28), note: "" });
      data.income.push({ id: uid(), date: ds, source: names[i % 5], amount: Math.round(dl * 1.2) });
      if (i % 3 === 0) data.expenditure.push({ id: uid(), date: ds, category: cats[Math.floor(i / 3) % 4], amount: 2500 + (i * 131) % 3000, note: "" });
    }
    save(); render();
  }

  function render() {
    var views = ["dashboard"].concat(Object.keys(T), ["reports"]);
    $("#nav").innerHTML = views.map(function (v) {
      return '<button data-view="' + v + '" class="' + (v === view ? "on" : "") + '">' + (T[v] ? T[v].label : v.charAt(0).toUpperCase() + v.slice(1)) + "</button>";
    }).join("");
    $("#main").innerHTML = view === "dashboard" ? dash() : view === "reports" ? rep() : listView(view);
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-view],[data-mode],[data-act],[data-del]");
    if (!b) return;
    var d = b.dataset;
    if (d.view) view = d.view;
    else if (d.mode) mode = d.mode;
    else if (d.del) { var p = d.del.split(":"); data[p[0]] = data[p[0]].filter(function (r) { return String(r.id) !== p[1]; }); save(); }
    else if (d.act === "sample") { sample(); return; }
    else if (d.act === "csv") { csv(); return; }
    else if (d.act === "print") { window.print(); return; }
    else if (d.act === "clear") { if (!confirm("Delete all records on this device?")) return; data = blank(); save(); }
    render();
  });

  document.addEventListener("submit", function (e) {
    var f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    var k = f.dataset.form, r = { id: uid() };
    T[k].fields.forEach(function (fd) {
      var v = f.elements[fd[0]].value.trim();
      r[fd[0]] = fd[2] === "number" ? +v : v;
    });
    lastDate = r.date || lastDate;
    data[k].push(r); save(); render();
  });

  render();
</script>
</body>
</html>
